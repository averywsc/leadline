<title>Leadline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,400;1,600&display=swap">
<style>
/* Layout: one narrow column. The toggle picks Daily or Endless.
   Palette: admiralty chart paper, with magenta as the one ink for everything you did. */
:root {
  --bg: #e7eeed;
  --panel: #f4f8f7;
  --sea: #d3e4e7;
  --grid: #a9c4ca;
  --land: #e4d9b6;
  --land-ink: #b3a370;
  --ink: #15252e;
  --ink-soft: #52676f;
  --line: #b7cdd1;
  --mag: #b1215c;
  --on-mag: #ffffff;
  --scrim: rgba(21, 37, 46, 0.55);
  --display: 'Spectral', Georgia, 'Times New Roman', serif;
  --ui: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b151b; --panel: #101e25; --sea: #12232b; --grid: #25414b;
    --land: #2c2b22; --land-ink: #5a553b; --ink: #d5e3e5; --ink-soft: #8ba1a7;
    --line: #26414a; --mag: #ee6aa0; --on-mag: #1b0912; --scrim: rgba(3, 8, 11, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b151b; --panel: #101e25; --sea: #12232b; --grid: #25414b;
  --land: #2c2b22; --land-ink: #5a553b; --ink: #d5e3e5; --ink-soft: #8ba1a7;
  --line: #26414a; --mag: #ee6aa0; --on-mag: #1b0912; --scrim: rgba(3, 8, 11, 0.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 1.25rem; }
p { margin: 0; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--mag); outline-offset: 2px; }
.label {
  font-size: 0.78rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-soft);
}

/* ---------- header and navigation ---------- */
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.brand { margin: 0; font: 600 2.2rem/1 var(--display); letter-spacing: -0.01em; }
.helpbtn {
  height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px;
  background: transparent; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 19px;
  font: 600 0.9rem var(--ui); letter-spacing: 0.04em; cursor: pointer; white-space: nowrap;
}
.helpbtn b {
  width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg);
  display: grid; place-items: center; font: 600 0.8rem var(--display);
}
.helpbtn:hover { background: var(--ink); color: var(--bg); }
.helpbtn:hover b { background: var(--bg); color: var(--ink); }
.subrow { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.modes { display: flex; border: 1.5px solid var(--ink); }
.mode {
  height: 34px; padding: 0 16px; border: 0; border-radius: 0; background: transparent; color: var(--ink);
  font: 600 0.88rem var(--ui); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.mode[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mode:not([aria-pressed="true"]):hover { background: color-mix(in srgb, var(--ink) 12%, transparent); }

/* ---------- three-step strip and coach ---------- */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps li {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; min-width: 0;
  border: 1.5px solid var(--line); background: var(--panel); color: var(--ink-soft);
  font: 600 0.82rem var(--ui); letter-spacing: 0.05em; text-transform: uppercase;
  transition: background 0.3s, color 0.3s, border-color 0.3s;
}
.steps li b {
  flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor;
  display: grid; place-items: center; font: 600 0.78rem var(--ui); transition: background 0.3s, border-color 0.3s;
}
.steps li.done { color: var(--ink); border-color: var(--ink-soft); }
.steps li.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.steps li.on b { background: var(--mag); border-color: var(--mag); color: var(--on-mag); animation: nudge 1.4s ease-in-out infinite; }
.coach {
  border-left: 4px solid var(--mag); background: var(--panel); padding: 10px 14px; min-height: 5.1rem;
  display: grid; align-content: center; gap: 2px;
}
.coach h3 { font-size: 1.2rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.coach p { color: var(--ink-soft); font-size: 0.98rem; }
.coach.in { animation: coachin 0.35s ease-out; }
.coach.warn { border-left-color: var(--ink); }
.coach.warn.in { animation: shake 0.4s; }

/* ---------- chart ---------- */
.gamehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.knots { display: flex; align-items: center; }
.knot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-soft); background: var(--bg); position: relative; transition: background 0.3s, border-color 0.3s; }
.knot + .knot { margin-left: 14px; }
.knot + .knot::before { content: ""; position: absolute; right: 100%; top: 50%; width: 14px; height: 2px; margin-top: -1px; background: var(--ink-soft); }
.knot.used { background: var(--ink); border-color: var(--ink); }
.knot.hit { background: var(--mag); border-color: var(--mag); }
.knot.pop { animation: pop 0.5s cubic-bezier(.3, 1.6, .5, 1); }
.board { background: var(--panel); border: 1px solid var(--line); padding: 10px; transition: box-shadow 0.4s; }
.board.flash { animation: flash 1.4s ease-out; }
#chart { display: block; width: 100%; height: auto; touch-action: manipulation; }
#chart:focus-visible { outline-offset: 4px; }
#chart .sea { fill: var(--sea); cursor: pointer; transition: fill 0.15s; }
#chart .sea:hover { fill: color-mix(in srgb, var(--sea) 70%, var(--mag)); }
#chart .land { fill: var(--land); cursor: not-allowed; }
#chart .hatch { stroke: var(--land-ink); stroke-width: 1; opacity: 0.55; }
#chart .grid { stroke: var(--grid); stroke-width: 1; fill: none; }
#chart .neat1 { fill: none; stroke: var(--ink); stroke-width: 1; }
#chart .neat2 { fill: none; stroke: var(--ink); stroke-width: 2.5; }
#chart .axis { font: 600 12px var(--ui); fill: var(--ink-soft); letter-spacing: 0.04em; }
#chart .cell.in, #chart .hatchrect.in { animation: cellin 0.6s cubic-bezier(.2, .8, .3, 1) both; transform-box: fill-box; transform-origin: center; }
#chart .ring {
  fill: var(--mag); fill-opacity: 0.15; stroke: var(--mag); stroke-width: 1.5; stroke-opacity: 0.95; fill-rule: evenodd;
  pointer-events: none; transform-box: fill-box; transform-origin: center;
}
#chart .ring.grow { animation: ringgrow 0.9s 0.25s cubic-bezier(.16, .84, .3, 1) both; }
#chart .pin { transform-box: fill-box; transform-origin: center; pointer-events: none; }
#chart .pin.drop { animation: pindrop 0.5s cubic-bezier(.3, 1.4, .5, 1) both; }
#chart .pinc { fill: var(--panel); stroke: var(--mag); stroke-width: 2; }
#chart .pin.hit .pinc { fill: var(--mag); }
#chart .fm { font: italic 600 17px var(--display); fill: var(--ink); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
#chart .xmark { stroke: var(--on-mag); stroke-width: 3.5; stroke-linecap: round; fill: none; stroke-dasharray: 20; }
#chart .xmark.draw { animation: draw 0.45s 0.15s ease-out both; }
#chart .xmark.ink { stroke: var(--mag); }
#chart .wreckrev { transform-box: fill-box; transform-origin: center; animation: pindrop 0.6s cubic-bezier(.3, 1.4, .5, 1) both; pointer-events: none; }
#chart .wreckbg { fill: var(--panel); stroke: var(--mag); stroke-width: 2; }
#chart .ping { fill: none; stroke: var(--mag); stroke-width: 2; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; pointer-events: none; animation: pingout 0.9s ease-out both; }
#chart .bubble { fill: none; stroke: var(--mag); stroke-width: 1.5; pointer-events: none; animation: rise 1.8s ease-out both; }
#chart .reticle { fill: none; stroke: var(--ink); stroke-width: 3; pointer-events: none; transform-box: fill-box; transform-origin: center; animation: reticle 1.1s ease-in-out infinite; }
#chart .reticle.bad { stroke-dasharray: 5 4; animation: none; }
#chart .reticle.bad.shake { animation: shake 0.4s; }
#chart .chip { fill: var(--mag); }
#chart .chiptxt { font: 600 12px var(--ui); fill: var(--on-mag); letter-spacing: 0.04em; }
#chart .hint { fill: none; stroke: var(--mag); stroke-width: 2.5; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; pointer-events: none; animation: hint 2.2s ease-out infinite; }
.legend { margin-top: 8px; display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.legend span { font-size: 0.85rem; color: var(--ink-soft); }

/* ---------- controls ---------- */
.cast { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
input[type="text"] {
  width: 6.5rem; height: 46px; padding: 0 12px;
  font: 600 1.25rem var(--display); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink); background: var(--panel); border: 1.5px solid var(--ink-soft); border-radius: 3px;
}
input[type="text"].wide { width: 9.5rem; }
input[type="text"]::placeholder { color: var(--ink-soft); opacity: 0.6; }
input[type="text"].shake { animation: shake 0.4s; border-color: var(--mag); }
.btn {
  font: 600 1rem var(--ui); letter-spacing: 0.04em; height: 46px; padding: 0 20px; border-radius: 3px; cursor: pointer;
  transition: transform 0.12s, background 0.2s;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.primary { background: var(--mag); color: var(--on-mag); border: 1.5px solid var(--mag); }
.primary:disabled { opacity: 0.4; cursor: not-allowed; }
.plain { background: transparent; color: var(--ink); border: 1.5px solid var(--ink-soft); }
.plain:hover { border-color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.quiet { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; height: 46px; padding: 0 6px; cursor: pointer; font: 500 0.95rem var(--ui); }
.quiet:hover { color: var(--ink); }

/* ---------- soundings and guesses ---------- */
.log { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.log li { display: grid; gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
.log li.rowin { animation: rowin 0.5s 0.15s ease-out both; }
.log .n { color: var(--ink-soft); font-weight: 600; font-variant-numeric: tabular-nums; }
.log .empty { display: block; color: var(--ink-soft); }
#wLog li { grid-template-columns: 1.6rem 3rem 5.2rem minmax(0, 1fr); }
#wLog .sq { font: 600 1.1rem var(--display); }
#wLog .fm { font: italic 600 1.3rem var(--display); font-variant-numeric: tabular-nums; }
#wLog .fm small { font: 500 0.8rem var(--ui); font-style: normal; letter-spacing: 0.06em; color: var(--ink-soft); }
#wLog .rng { color: var(--ink-soft); font-size: 0.95rem; min-width: 0; }
#wLog .found .fm, #wLog .found .rng { color: var(--mag); }
.pips { display: flex; gap: 4px; align-self: center; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }
.pips i.on { background: var(--ink); border-color: var(--ink); }
.found .pips i { background: var(--mag); border-color: var(--mag); }
.key { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 8px; }

/* ---------- result ---------- */
.result { border: 2px solid var(--ink); background: var(--panel); padding: 18px; display: grid; gap: 14px; }
.result.in { animation: resultin 0.6s cubic-bezier(.2, .8, .3, 1) both; }
.result pre {
  margin: 0; font: 500 1.15rem/1.5 var(--ui); letter-spacing: 0.05em; white-space: pre-wrap;
  background: var(--bg); padding: 10px 12px; border-left: 4px solid var(--mag); user-select: all;
}
.result .row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.nextin { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* ---------- record ---------- */
.record { display: grid; gap: 14px; }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0; }
.nums div { border-top: 2px solid var(--ink); padding-top: 6px; }
.nums dt { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-soft); }
.nums dd { margin: 2px 0 0; font: 600 1.9rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.dist { display: grid; gap: 5px; }
.dist div { display: grid; grid-template-columns: 1.2rem minmax(0, 1fr); gap: 8px; align-items: center; }
.dist b { font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.dist i { display: block; height: 20px; min-width: 24px; background: var(--ink-soft); color: var(--bg); font: 600 0.85rem/20px var(--ui); font-style: normal; padding-right: 6px; text-align: right; font-variant-numeric: tabular-nums; transform-origin: left; animation: grow 0.6s ease-out both; }
.dist i.today { background: var(--mag); color: var(--on-mag); }

/* ---------- how to play ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--scrim);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fadein 0.25s ease-out;
}
.how {
  background: var(--panel); border: 2px solid var(--ink); width: 100%; max-width: 480px; max-height: 100%; overflow: auto;
  padding: 18px; display: grid; gap: 14px; animation: resultin 0.4s cubic-bezier(.2, .8, .3, 1);
}
.how { --loop: 12s; }
.how h2 { font-size: 1.5rem; }
.how .intro { color: var(--ink-soft); }
.how ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: s; }
.how ol li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; opacity: 0.5; animation: var(--stepanim) var(--loop) infinite; }
.how ol li::before {
  counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg);
  display: grid; place-items: center; font: 600 0.9rem var(--ui);
}
.how ol li b { font-weight: 600; }
.how ol li:nth-child(1) { --stepanim: stepA; }
.how ol li:nth-child(2) { --stepanim: stepB; }
.how ol li:nth-child(3) { --stepanim: stepC; }
.how .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.how .foot p { color: var(--ink-soft); font-size: 0.92rem; flex: 1 1 12rem; }
.demo { --loop: 12s; width: 100%; max-width: 300px; margin: 0 auto; display: block; border: 1px solid var(--line); background: var(--sea); }
.demo .d-sea { fill: var(--sea); }
.demo .d-grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.demo .d-land { fill: var(--land); stroke: var(--land-ink); stroke-width: 1; }
.demo .d-ring { fill: var(--mag); fill-opacity: 0.16; stroke: var(--mag); stroke-width: 1.5; fill-rule: evenodd; transform-box: fill-box; transform-origin: center; opacity: 0; }
.demo .r1 { animation: dRing1 var(--loop) infinite both; }
.demo .r2 { animation: dRing2 var(--loop) infinite both; }
.demo .d-pin circle { fill: var(--panel); stroke: var(--mag); stroke-width: 2; }
.demo .d-pin text { font: italic 600 15px var(--display); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.demo .d-pin { opacity: 0; transform-box: fill-box; transform-origin: center; }
.demo .p1 { animation: dPin1 var(--loop) infinite both; }
.demo .p2 { animation: dPin2 var(--loop) infinite both; }
.demo .p3 { animation: dPin3 var(--loop) infinite both; }
.demo .p3 circle { fill: var(--mag); }
.demo .p3 path { stroke: var(--on-mag); stroke-width: 3; stroke-linecap: round; fill: none; }
.demo .d-ret { fill: none; stroke: var(--ink); stroke-width: 3; opacity: 0; }
.demo .q1 { animation: dRet1 var(--loop) infinite both; }
.demo .q2 { animation: dRet2 var(--loop) infinite both; }
.demo .q3 { animation: dRet3 var(--loop) infinite both; }
.demo .d-ping { fill: none; stroke: var(--mag); stroke-width: 2; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; opacity: 0; animation: dPing var(--loop) infinite both; }
.demo .d-tag { font: 600 11px var(--ui); letter-spacing: 0.06em; text-transform: uppercase; fill: var(--ink-soft); opacity: 0; }
.demo .t1 { animation: dTag1 var(--loop) infinite both; }
.demo .t2 { animation: dTag2 var(--loop) infinite both; }
.demo .t3 { animation: dTag3 var(--loop) infinite both; }

/* ---------- keyframes ---------- */
@keyframes cellin { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: none; } }
@keyframes ringgrow { from { transform: scale(0.02); opacity: 0; } 15% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
@keyframes pindrop { 0% { transform: translateY(-34px) scale(1.5); opacity: 0; } 55% { transform: translateY(2px) scale(0.94); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes pingout { from { transform: scale(1); opacity: 0.9; } to { transform: scale(5); opacity: 0; } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-78px); opacity: 0; } }
@keyframes draw { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
@keyframes reticle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.88); opacity: 0.7; } }
@keyframes hint { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(3.4); opacity: 0; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
@keyframes coachin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes resultin { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes rowin { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
@keyframes flash { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--mag) 55%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes flip { from { transform: translateY(-0.5em); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes markin { from { transform: translateX(-50%) translateY(-12px) scale(0.4); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
/* tutorial timelines, all 12s: pick, drop, ring, pick, drop, ring, hit */
@keyframes dRet1 { 0%, 3% { opacity: 0; } 5%, 10% { opacity: 1; } 12%, 100% { opacity: 0; } }
@keyframes dRet2 { 0%, 30% { opacity: 0; } 32%, 38% { opacity: 1; } 40%, 100% { opacity: 0; } }
@keyframes dRet3 { 0%, 58% { opacity: 0; } 60%, 65% { opacity: 1; } 67%, 100% { opacity: 0; } }
@keyframes dPin1 { 0%, 11% { opacity: 0; transform: translateY(-20px); } 15%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes dPin2 { 0%, 39% { opacity: 0; transform: translateY(-20px); } 43%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes dPin3 { 0%, 66% { opacity: 0; transform: translateY(-20px); } 70%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes dRing1 { 0%, 14% { opacity: 0; transform: scale(0.02); } 28%, 92% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
@keyframes dRing2 { 0%, 42% { opacity: 0; transform: scale(0.02); } 56%, 92% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
@keyframes dPing { 0%, 68% { opacity: 0; transform: scale(1); } 70% { opacity: 0.9; transform: scale(1); } 84%, 100% { opacity: 0; transform: scale(6); } }
@keyframes dTag1 { 0%, 4% { opacity: 0; } 6%, 28% { opacity: 1; } 30%, 100% { opacity: 0; } }
@keyframes dTag2 { 0%, 30% { opacity: 0; } 32%, 56% { opacity: 1; } 58%, 100% { opacity: 0; } }
@keyframes dTag3 { 0%, 58% { opacity: 0; } 60%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
@keyframes stepA { 0%, 29% { opacity: 1; } 31%, 100% { opacity: 0.45; } }
@keyframes stepB { 0%, 29% { opacity: 0.45; } 31%, 57% { opacity: 1; } 59%, 100% { opacity: 0.45; } }
@keyframes stepC { 0%, 57% { opacity: 0.45; } 59%, 94% { opacity: 1; } 98%, 100% { opacity: 0.45; } }

@media (max-width: 480px) {
  .brand { font-size: 1.9rem; }
  .helpbtn span { display: none; }

<script>
// Puzzle logic. No DOM in here, so the same file runs in the page and in node.

const CFG = {
  size: 15,
  marks: [2, 5, 10, 20, 35],
  a: 0.4,   // fathoms at the wreck's own doorstep
  b: 2.0,   // extra fathoms per square of distance
  max: 6,   // casts per day
  epoch: '2026-11-09'
};

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function dateKey(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  const [ey, em, ed] = CFG.epoch.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ey, em - 1, ed)) / 86400000) + 1;
}

function makeChart(key) {
  const N = CFG.size;
  const rnd = mulberry32(hashStr('leadline/' + key));
  const land = new Array(N * N).fill(false);
  const isles = 3 + Math.floor(rnd() * 3);
  for (let n = 0; n < isles; n++) {
    const cx = 1 + rnd() * (N - 2);
    const cy = 1 + rnd() * (N - 2);
    const r = 1.1 + rnd() * 1.7;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const d = Math.hypot(x - cx, y - cy);
        if (d < r + (rnd() - 0.5) * 1.1) land[y * N + x] = true;
      }
    }
  }
  const water = [];
  for (let i = 0; i < N * N; i++) if (!land[i]) water.push(i);
  const wreck = water[Math.floor(rnd() * water.length)];
  return { land, water, wreck };
}

function cellName(i) {
  const N = CFG.size;
  return String.fromCharCode(65 + (i % N)) + (Math.floor(i / N) + 1);
}

function parseCell(text) {
  const m = /^\s*([a-oA-O])\s*(\d{1,2})\s*$/.exec(text || '');
  if (!m) return -1;
  const x = m[1].toUpperCase().charCodeAt(0) - 65;
  const y = parseInt(m[2], 10) - 1;
  if (x < 0 || x >= CFG.size || y < 0 || y >= CFG.size) return -1;
  return y * CFG.size + x;
}

function distance(i, j) {
  const N = CFG.size;
  return Math.hypot((i % N) - (j % N), Math.floor(i / N) - Math.floor(j / N));
}

// Which mark on the line a given distance rounds to. -1 means the lead hit the wreck.
function markForDist(dist) {
  if (dist === 0) return -1;
  const depth = CFG.a + CFG.b * dist;
  const m = CFG.marks;
  for (let k = 0; k < m.length - 1; k++) {
    if (depth < (m[k] + m[k + 1]) / 2) return k;
  }
  return m.length - 1;
}

function markIndex(guess, wreck) {
  return guess === wreck ? -1 : markForDist(distance(guess, wreck));
}

// Ring for a reading, in squares from the cast point.
function band(k) {
  const m = CFG.marks;
  const lo = k === 0 ? 0 : ((m[k - 1] + m[k]) / 2 - CFG.a) / CFG.b;
  const hi = k === m.length - 1 ? 60 : ((m[k] + m[k + 1]) / 2 - CFG.a) / CFG.b;
  return { lo: Math.max(0, lo), hi };
}

function squaresLeft(chart, casts) {
  return chart.water.filter((c) =>
    casts.every((g) => markIndex(g.cell, c) === g.k && g.cell !== c)
  );
}


if (typeof module !== 'undefined') {
  module.exports = { CFG, hashStr, mulberry32, dateKey, dayNumber, makeChart, cellName,
    parseCell, distance, markForDist, markIndex, band, squaresLeft };
}

    var mid = (N - 1) / 2;
    for (var i = 0; i < N * N; i++) {
      var cx = i % N, cy = Math.floor(i / N), x = M + cx * S, y = M + cy * S;
      var delay = Math.round(Math.hypot(cx - mid, cy - mid) * 45);
      var anim = intro && !reduce ? ' in" style="animation-delay:' + delay + 'ms' : '';
      s += '<rect class="cell ' + (W.chart.land[i] ? 'land' : 'sea') + anim + '" data-i="' + i + '" x="' + x + '" y="' + y + '" width="' + S + '" height="' + S + '"/>';
      if (W.chart.land[i]) s += '<rect class="hatchrect' + anim + '" x="' + x + '" y="' + y + '" width="' + S + '" height="' + S + '" fill="url(#hatch)" pointer-events="none"/>';
    }
    var g = '';
    for (var k = 0; k <= N; k++) g += 'M' + (M + k * S) + ' ' + M + 'V' + (M + N * S) + 'M' + M + ' ' + (M + k * S) + 'H' + (M + N * S);
    s += '<path class="grid" d="' + g + '" pointer-events="none"/>';
    s += '<rect class="neat1" x="' + (M - 5) + '" y="' + (M - 5) + '" width="' + (N * S + 10) + '" height="' + (N * S + 10) + '" pointer-events="none"/>';
    s += '<rect class="neat2" x="' + M + '" y="' + M + '" width="' + N * S + '" height="' + N * S + '" pointer-events="none"/>';
    for (var c = 0; c < N; c++) {
      s += '<text class="axis" text-anchor="middle" x="' + (M + c * S + S / 2) + '" y="' + (M - 9) + '">' + String.fromCharCode(65 + c) + '</text>';
      s += '<text class="axis" text-anchor="end" dominant-baseline="central" x="' + (M - 9) + '" y="' + (M + c * S + S / 2) + '">' + (c + 1) + '</text>';
    }
    s += '<g id="gRings" clip-path="url(#clip)"></g><g id="gFx"></g><g id="gPins"></g><g id="gSel"></g>';
    $('chart').innerHTML = s;
    W.g = { rings: $('gRings'), fx: $('gFx'), pins: $('gPins'), sel: $('gSel') };
  }

  function ripple(p, delay, cls) {
    var c = svgEl('circle', { cx: p[0], cy: p[1], r: 15 }, cls || 'ping');
    c.style.animationDelay = delay + 'ms';
    W.g.fx.appendChild(c);
    setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, delay + 1200);
  }
  function addCast(c, animate) {
    var p = center(c.cell);
    if (c.k >= 0) {
      var b = band(c.k);
      W.g.rings.appendChild(svgEl('path', { d: ringPath(p[0], p[1], b.lo * S, b.hi * S) }, 'ring' + (animate ? ' grow' : '')));
    }
    var wrap = svgEl('g', { transform: 'translate(' + p[0] + ' ' + p[1] + ')' });
    var pin = svgEl('g', null, 'pin' + (animate ? ' drop' : '') + (c.k < 0 ? ' hit' : ''));
    pin.appendChild(svgEl('circle', { r: 15 }, 'pinc'));
    if (c.k >= 0) {
      var t = svgEl('text', { y: 1 }, 'fm');
      t.textContent = animate ? '0' : CFG.marks[c.k];
      pin.appendChild(t);
      if (animate) setTimeout(function () { tween(t, CFG.marks[c.k], 700); }, 250);
    } else {
      pin.appendChild(svgEl('path', { d: 'M-7 -7L7 7M7 -7L-7 7' }, 'xmark' + (animate ? ' draw' : '')));
    }
    wrap.appendChild(pin);
    W.g.pins.appendChild(wrap);
    if (animate) ripple(p, 120);
  }
  function celebrate() {
    var p = center(W.chart.wreck);
    ripple(p, 450); ripple(p, 750); ripple(p, 1050);
    for (var i = 0; i < 12; i++) {
      var b = svgEl('circle', { cx: p[0] + (Math.random() - 0.5) * 56, cy: p[1] + (Math.random() - 0.2) * 20, r: 2 + Math.random() * 3.5 }, 'bubble');
      b.style.animationDelay = (500 + Math.random() * 900) + 'ms';
      W.g.fx.appendChild(b);
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3400); })(b);
    }
    retrigger($('board'), 'flash');
  }
  function revealWreck() {
    var p = center(W.chart.wreck);
    var g = svgEl('g', { transform: 'translate(' + p[0] + ' ' + p[1] + ')' });
    var inner = svgEl('g', null, 'wreckrev');
    inner.style.animationDelay = '700ms';
    inner.appendChild(svgEl('circle', { r: 15 }, 'wreckbg'));
    inner.appendChild(svgEl('path', { d: 'M-7 -7L7 7M7 -7L-7 7' }, 'xmark ink'));
    g.appendChild(inner);
    W.g.pins.appendChild(g);
    ripple(p, 700, 'ping');
  }

  function drawSel() {
    var g = W.g.sel;
    g.innerHTML = '';
    if (W.sel === null || wDone()) return;
    var cx = W.sel % N, cy = Math.floor(W.sel / N);
    var x = M + cx * S, y = M + cy * S, land = W.chart.land[W.sel];
    g.appendChild(svgEl('rect', { x: x + 1.5, y: y + 1.5, width: S - 3, height: S - 3 }, 'reticle' + (land ? ' bad shake' : '')));
    function chip(px, py, w, txt, tx, ty) {
      g.appendChild(svgEl('rect', { x: px, y: py, width: w, height: 18, rx: 2 }, 'chip'));
      var t = svgEl('text', { x: tx, y: ty, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, 'chiptxt');
      t.textContent = txt; g.appendChild(t);
    }
    chip(x + 8, 4, S - 16, String.fromCharCode(65 + cx), x + S / 2, 13);
    chip(1, y + S / 2 - 9, M - 5, String(cy + 1), (M - 4) / 2 + 1, y + S / 2);
  }
  function drawHint() {
    W.g.fx.querySelectorAll('.hint').forEach(function (e) { e.parentNode.removeChild(e); });
    if (W.casts.length || W.sel !== null || wDone()) return;
    var p = center(nearestWater(W.chart));
    [0, 700].forEach(function (d) {
      var c = svgEl('circle', { cx: p[0], cy: p[1], r: 16 }, 'hint');
      c.style.animationDelay = d + 'ms';
      W.g.fx.appendChild(c);
    });
  }

  function rangeText(k) {
    var b = band(k);
    if (k === 0) return 'closer than ' + b.hi.toFixed(1) + ' squares';
    if (k === CFG.marks.length - 1) return 'more than ' + b.lo.toFixed(1) + ' squares away';
    return b.lo.toFixed(1) + ' to ' + b.hi.toFixed(1) + ' squares away';
  }
  function wLogRender(fresh) {
    var h = '';
    W.casts.forEach(function (c, n) {
      var cls = n === fresh ? 'rowin' : '';
      if (c.k < 0) h += '<li class="found ' + cls + '"><span class="n">' + (n + 1) + '</span><span class="sq">' + cellName(c.cell) + '</span><span class="fm">Wreck</span><span class="rng">The lead struck it.</span></li>';
      else h += '<li class="' + cls + '"><span class="n">' + (n + 1) + '</span><span class="sq">' + cellName(c.cell) + '</span><span class="fm">' + CFG.marks[c.k] + ' <small>FM</small></span><span class="rng">' + rangeText(c.k) + '</span></li>';
    });
    if (!W.casts.length) h = '<li class="empty">Your readings will appear here.</li>';
    $('wLog').innerHTML = h;
  }

  function wCoachRender(animateTitle) {
    var n = W.casts.length, left = CFG.max - n, last = W.casts[n - 1], h3;
    if (wWon()) {
      setCoach('wCoach', 'Wreck found', 'You struck it on cast ' + n + ' of ' + CFG.max + '.', 3, 'wSteps');
    } else if (wDone()) {
      setCoach('wCoach', 'Out of casts', 'The wreck was at ' + cellName(W.chart.wreck) + '. It is marked on the chart.', 3, 'wSteps');
    } else if (W.sel !== null && W.chart.land[W.sel]) {
      setCoach('wCoach', cellName(W.sel) + ' is land', 'The line only drops in open water. Pick a blue square.', 0, 'wSteps', true);
    } else if (W.sel !== null) {
      setCoach('wCoach', cellName(W.sel) + ' selected', 'Press Drop the line, or tap the square again.', 1, 'wSteps');
    } else if (n === 0) {
      setCoach('wCoach', 'Pick a square', 'Tap any blue square. A wreck is hiding on open water somewhere on this chart, and you have six casts to find it.', 0, 'wSteps');
    } else {
      var title = last.k < 0 ? '' : CFG.marks[last.k] + ' fathoms at ' + cellName(last.cell);
      var body = rangeText(last.k).replace(/^./, function (m) { return m.toUpperCase(); }).replace('squares', 'squares') + '. ' +
        (n === 1 ? 'The wreck is inside the shaded ring. Cast again somewhere in it.' : 'Cast where the rings overlap.') +
        ' ' + left + (left === 1 ? ' cast left.' : ' casts left.');
      h3 = setCoach('wCoach', title, body, 2, 'wSteps');
      if (animateTitle && last.k >= 0) {
        h3.textContent = '0 fathoms at ' + cellName(last.cell);
        var el = document.createElement('span'); el.textContent = '0';
        var m = CFG.marks[last.k], cell = cellName(last.cell);
        h3.textContent = '';
        h3.appendChild(el); h3.appendChild(document.createTextNode(' fathoms at ' + cell));
        setTimeout(function () { tween(el, m, 700); }, 250);
      }
    }
  }

  function wResultRender(delay) {
    if (!wDone()) { hideResult('w'); return; }
    var won = wWon(), daily = W.mode === 'daily', where = cellName(W.chart.wreck), n = W.casts.length;
    var glyphs = W.casts.map(function (c) { return c.k < 0 ? '◆' : SHARE[c.k]; }).join('');
    var text = won ? 'The wreck lies at ' + where + '. You found it on cast ' + n + ' of ' + CFG.max + '.'
      : 'The wreck was at ' + where + '.' + (daily ? ' A new chart arrives at midnight.' : '');
    var share = daily ? 'Leadline No. ' + dayNo + '  ' + (won ? n : 'X') + '/' + CFG.max + '\n' + glyphs : '';
    showResult('w', {
      head: won ? 'Found it' : 'Not this time', text: text, share: share, timer: daily,
      b1: daily ? ['Copy result', function (btn, pre) { copyText(share, btn, pre, 'Copy result'); }]
                : ['Next chart', function () { wNewRound(); }],
      b2: daily ? ['Play endless', function () { go('endless'); }]
                : ['Back to daily', function () { go('daily'); }]
    }, delay);
    if (!daily) setTimeout(function () { var b = $('wB1'); if (b && !$('wResult').hidden && !reduce) b.focus({ preventScroll: true }); }, delay + 700);
  }

  function wRender(fresh) {
    var done = wDone();
    wLogRender(fresh);
    renderKnots('wKnots', W.casts.length, CFG.max, W.casts.map(function (c) { return c.k < 0; }), fresh >= 0);
    $('wCount').textContent = done ? 'Done' : 'Cast ' + (W.casts.length + 1) + ' of ' + CFG.max;
    $('wBtn').disabled = done; $('sq').disabled = done;
    $('wSkip').hidden = !(W.mode === 'endless' && !done && W.casts.length > 0);
    if (done) W.g.sel.innerHTML = '';
    wCoachRender(fresh >= 0);
    drawSel(); drawHint();
    wRecordRender();
    if (fresh < 0) wResultRender(0);
    var sub = W.mode === 'daily' ? 'Chart No. ' + dayNo + ' · ' + dateWords()
      : 'Round ' + (store.s.we.played + (done ? 0 : 1)) + ' · ' + store.s.we.won + ' found';
    $('sub').textContent = sub;
    if (done && fresh < 0 && !wWon()) { /* loaded finished loss: show the wreck */ revealStatic(); }
  }
  function revealStatic() {
    if (W.g.pins.querySelector('.wreckrev')) return;
    var p = center(W.chart.wreck);
    var g = svgEl('g', { transform: 'translate(' + p[0] + ' ' + p[1] + ')' });
    g.appendChild(svgEl('circle', { r: 15 }, 'wreckbg'));
    g.appendChild(svgEl('path', { d: 'M-7 -7L7 7M7 -7L-7 7' }, 'xmark ink'));
    W.g.pins.appendChild(g);
  }
  function wRecordRender() {
    var done = wDone();
    renderRecord('w', wStats(), W.mode === 'daily', CFG.max, done && wWon() ? W.casts.length - 1 : -1, W.mode === 'daily' ? 'Daily' : 'Endless');
  }

  function wCast(i) {
    if (wDone()) return;
    if (W.chart.land[i]) { W.sel = i; drawSel(); wCoachRender(false); return; }
    if (W.casts.some(function (c) { return c.cell === i; })) {
      setCoach('wCoach', 'Already sounded', 'You already dropped the line at ' + cellName(i) + '. Pick a different square.', 0, 'wSteps', true);
      return;
    }
    var k = markIndex(i, W.chart.wreck), c = { cell: i, k: k };
    W.casts.push(c);
    var r = wRound();
    r.cells = W.casts.map(function (x) { return x.cell; });
    W.sel = null;
    $('sq').value = '';
    addCast(c, true);
    var won = k === -1, over = won || W.casts.length >= CFG.max;
    if (over && !r.recorded) { r.recorded = true; applyWin(wStats(), W.mode === 'daily', W.casts.length, won); }
    save();
    if (won) celebrate();
    else if (over) revealWreck();
    wRender(W.casts.length - 1);
    if (over) wResultRender(won ? 1900 : 2300);
  }
  function wPick(i) {
    W.sel = i;
    $('sq').value = cellName(i);
    drawSel(); drawHint(); wCoachRender(false);
  }
  function wNewRound() {
    store.we = { seed: newSeed(), cells: [], recorded: false };
    save();
    hideResult('w');
    wInit('endless');
    var b = $('board'); b.scrollIntoView && b.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
  }

  $('chart').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-i]') : null;
    if (!t || wDone()) return;
    var i = +t.getAttribute('data-i');
    if (W.sel === i && !W.chart.land[i]) { wCast(i); return; }
    wPick(i);
  });
  $('chart').addEventListener('keydown', function (e) {
    if (wDone()) return;
    var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (d) {
      e.preventDefault();
      var cur = W.sel === null ? Math.floor(N / 2) * N + Math.floor(N / 2) : W.sel;
      wPick(Math.min(N - 1, Math.max(0, Math.floor(cur / N) + d[1])) * N + Math.min(N - 1, Math.max(0, (cur % N) + d[0])));
    } else if ((e.key === 'Enter' || e.key === ' ') && W.sel !== null) { e.preventDefault(); wCast(W.sel); }
  });
  $('sq').addEventListener('input', function () {
    var i = parseCell($('sq').value);
    W.sel = i >= 0 ? i : null;
    drawSel(); drawHint();
    if (i >= 0) wCoachRender(false);
  });
  $('wForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var i = parseCell($('sq').value);
    if (i < 0) {
      retrigger($('sq'), 'shake');
      setCoach('wCoach', 'Not a square', 'Type a letter from A to O and a number from 1 to 15, like H9. Or tap the chart.', 0, 'wSteps', true);
      return;
    }
    wCast(i);
  });
  $('wSkip').addEventListener('click', function () { wNewRound(); });

  /* ================= how to play ================= */
  var lastFocus = null;
  function wreckHow() {
    var s = 36, pxr = function (cx, cy, a, b) {
      function c(r) { return 'M' + (cx - r) + ' ' + cy + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0Z'; }
      return c(b) + (a > 0 ? c(a) : '');
    };
    var grid = '';
    for (var k = 1; k < 7; k++) grid += 'M' + (k * s) + ' 0V252M0 ' + (k * s) + 'H252';
    return '<h2 id="howTitle">How to play Leadline</h2>' +
      '<p class="intro">A wreck is hiding somewhere on this chart. Find it in six casts.</p>' +
      '<svg class="demo" viewBox="0 0 252 252" aria-hidden="true"><defs><clipPath id="dclip"><rect width="252" height="252"/></clipPath></defs>' +
      '<rect class="d-sea" width="252" height="252"/><rect class="d-land" x="144" y="0" width="72" height="36"/><rect class="d-land" x="180" y="36" width="36" height="36"/>' +
      '<path class="d-grid" d="' + grid + '"/>' +
      '<g clip-path="url(#dclip)"><path class="d-ring r1" d="' + pxr(54, 90, 3.55 * s, 7.3 * s) + '"/><path class="d-ring r2" d="' + pxr(126, 162, 1.55 * s, 3.55 * s) + '"/></g>' +
      '<rect class="d-ret q1" x="37.5" y="73.5" width="33" height="33"/><rect class="d-ret q2" x="109.5" y="145.5" width="33" height="33"/><rect class="d-ret q3" x="181.5" y="145.5" width="33" height="33"/>' +
      '<g transform="translate(54 90)"><g class="d-pin p1"><circle r="14"/><text y="1">10</text></g></g>' +
      '<g transform="translate(126 162)"><g class="d-pin p2"><circle r="14"/><text y="1">5</text></g></g>' +
      '<g transform="translate(198 162)"><circle class="d-ping" r="14"/><g class="d-pin p3"><circle r="14"/><path d="M-6 -6L6 6M6 -6L-6 6"/></g></g>' +
      '<text class="d-tag t1" x="8" y="244">10 fathoms: far away</text><text class="d-tag t2" x="8" y="244">5 fathoms: closer</text><text class="d-tag t3" x="8" y="244">Where the rings cross</text>' +
      '</svg>' +
      '<ol>' +
      '<li><span><b>Pick a square.</b> Tap any blue square of open water. Land cannot be sounded.</span></li>' +
      '<li><span><b>Drop the line.</b> You get a depth in fathoms. Deeper means farther from the wreck. The line is only marked at 2, 5, 10, 20 and 35, so every reading is rounded.</span></li>' +
      '<li><span><b>Read the rings.</b> Each reading draws a ring, and the wreck is somewhere inside it. Cast again where rings overlap until the lead strikes the wreck.</span></li>' +
      '</ol>' +
      '<div class="foot"><p>Daily gives everyone the same chart. Endless gives you a new one every round.</p><button type="button" class="btn primary" id="howGo">Start playing</button></div>';
  }
  function openHow() {
    lastFocus = document.activeElement;
    $('how').innerHTML = wreckHow();
    $('howOverlay').hidden = false;
    store.seen.wreck = true; save();
    $('howGo').addEventListener('click', closeHow);
    $('howGo').focus({ preventScroll: true });
  }
  function closeHow() {
    $('howOverlay').hidden = true;
    $('how').innerHTML = '';
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }
  $('helpBtn').addEventListener('click', function () { openHow(); });
  $('howOverlay').addEventListener('click', function (e) { if (e.target === $('howOverlay')) closeHow(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('howOverlay').hidden) closeHow(); });

  /* ================= apply route ================= */
  function apply() {
    $('modeDaily').setAttribute('aria-pressed', route.mode === 'daily');
    $('modeEndless').setAttribute('aria-pressed', route.mode === 'endless');
    wInit(route.mode);
    if (!store.seen.wreck) setTimeout(function () { if (!store.seen.wreck) openHow(); }, 350);
  }

  /* ================= clock ================= */
  function tick() {
    var now = new Date(), k = dateKey(now);
    if (k !== todayKey) {
      todayKey = k; dayNo = dayNumber(k); store.wd = null; save();
      if (route.mode === 'daily') apply();
      return;
    }
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    var s = Math.max(0, Math.floor((next - now) / 1000)), pd = function (n) { return String(n).padStart(2, '0'); };
    $('wNext').textContent = 'Next chart in ' + pd(Math.floor(s / 3600)) + ':' + pd(Math.floor(s % 3600 / 60)) + ':' + pd(s % 60);
  }
  setInterval(tick, 1000);

  var start = parseHash();
  if (start) route = start;
  apply();
})();
</script>
